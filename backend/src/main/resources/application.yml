spring:
  application:
    name: leasrecover
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leasrecover}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multiTenancy: SCHEMA
      org:
        hibernate:
          envers:
            audit_table_suffix: _aud
            revision_field_name: rev
            revision_type_field_name: revtype

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/public

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:ilhemby1999@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:ijqx zbrq daiv uvwg}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${BACKEND_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:replace_me_with_a_secure_base64_encoded_256bit_key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    webhook-url: ${AI_SERVICE_WEBHOOK_URL:http://backend:8080/api/v1/internal/webhooks/ai-progress}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

leasrecover:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
