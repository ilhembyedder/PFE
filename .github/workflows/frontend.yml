name: frontend

on:
  push:
    branches: [master, fixes]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

      # WCAG 2.1 AA audit of the compiled token layer. Reads the shipped
      # sRGB fallbacks, not the authored OKLCH, because rounding between the
      # two is exactly where a ratio slips below threshold unnoticed.
      - name: Contrast audit
        run: npm run verify:contrast
